# Disposable free-tier environment for Windows desktop license activation tests.
# SQLite data lives on Render's ephemeral filesystem and may be lost on spin-down,
# restart, or deploy. Never use this Blueprint for real owner or resident data.
services:
  - type: web
    name: autrobstay
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NIVASBOOK_DATA_DIR
        value: /tmp/nivasbook-data
      - key: NIVASBOOK_SESSION_SECRET
        generateValue: true
      - key: NIVASBOOK_OWNER_EMAIL
        sync: false
      - key: NIVASBOOK_OWNER_PASSWORD
        sync: false
      - key: NIVASBOOK_PLATFORM_EMAIL
        sync: false
      - key: NIVASBOOK_PLATFORM_PASSWORD
        sync: false
      - key: NIVASBOOK_ENABLE_DESKTOP_LICENSE_ACTIVATION
        value: "1"
